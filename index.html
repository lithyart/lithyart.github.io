<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lithy</title>
    
    <!-- Modern Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* TEMEL AYARLAR */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; 
            -webkit-user-select: none;
        }

        body {
            background-color: #000000; /* AMOLED Tam Siyah */
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding: 3vw 4vw;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* HEADER VE MİNİMALİST ÜST TASARIM */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4vw;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 1.5vw;
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .top-nav {
            display: flex;
            gap: 25px;
        }

        .top-nav a {
            color: #666666;
            text-decoration: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .top-nav a:hover {
            color: #ffffff;
        }

        /* GRID DÜZENİ */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2vw;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            text-decoration: none;
            cursor: pointer;
            opacity: 0; 
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* AÇILIŞ ANİMASYONLARI */
        .grid-item:nth-child(1) { animation-delay: 0.1s; }
        .grid-item:nth-child(2) { animation-delay: 0.2s; }
        .grid-item:nth-child(3) { animation-delay: 0.3s; }
        .grid-item:nth-child(4) { animation-delay: 0.4s; }
        .grid-item:nth-child(5) { animation-delay: 0.5s; }
        .grid-item:nth-child(6) { animation-delay: 0.6s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* GÖRSEL ALANI (3500x4500 Dikey/Karemsi Oran Optimizasyonu) */
        .image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 5; /* Dikey yüksek çözünürlüklü fotolar için ideal oran */
            background-color: #080808;
            overflow: hidden;
            margin-bottom: 1vw;
        }

        /* Sağ Tık ve İndirme Koruma Katmanı */
        .image-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            object-position: center; 
            image-rendering: high-quality; 
            display: block;
            pointer-events: none; 
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        }

        .grid-item:hover .image-wrapper img {
            transform: scale(1.05); 
            opacity: 0.7;
        }

        /* ALT YAZILAR */
        .caption {
            display: flex;
            align-items: center; 
        }

        .caption .title {
            color: #ffffff;
            font-family: 'Bebas Neue', sans-serif; 
            font-size: 1.5rem;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* LIGHTBOX (YAKINLAŞTIRMA EKRANI) */
        #lightbox {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        #lightbox.active {
            opacity: 1;
            pointer-events: all;
        }

        #lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none; 
        }

        #lightbox.active img {
            transform: scale(1);
        }

        #lightbox-close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #ffffff;
            font-size: 40px;
            font-weight: 300;
            cursor: pointer;
            z-index: 10000;
            transition: color 0.3s ease;
        }

        #lightbox-close:hover {
            color: #888;
        }

        /* MOBİL UYUM */
        @media (max-width: 1024px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); gap: 4vw; }
        }

        @media (max-width: 600px) {
            body { padding: 6vw; }
            header { margin-bottom: 8vw; padding-bottom: 3vw; }
            .grid-container { grid-template-columns: 1fr; gap: 8vw; }
            .image-wrapper { margin-bottom: 3vw; }
            #lightbox-close { top: 20px; right: 25px; font-size: 35px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>lithy</h1>
        <nav class="top-nav">
            <a href="#">INFO</a>
            <a href="#">CONTACT</a>
        </nav>
    </header>

    <main class="grid-container">
        <!-- Proje 1 -->
        <div class="grid-item">
            <div class="image-wrapper">
                <img src="1.png" alt="01">
            </div>
            <div class="caption">
                <span class="title">Cursed Lake</span>
            </div>
        </div>

        <!-- Proje 2 -->
        <div class="grid-item">
            <div class="image-wrapper">
                <img src="2.png" alt="02">
            </div>
            <div class="caption">
                <span class="title">Why me?</span>
            </div>
        </div>

        <!-- Proje 3 -->
        <div class="grid-item">
            <div class="image-wrapper">
                <img src="3.png" alt="03">
            </div>
            <div class="caption">
                <span class="title">Avril Lavigne</span>
            </div>
        </div>

        <!-- Proje 4 -->
        <div class="grid-item">
            <div class="image-wrapper">
                <img src="4.png" alt="04">
            </div>
            <div class="caption">
                <span class="title">Chucky</span>
            </div>
        </div>

        <!-- Proje 5 -->
        <div class="grid-item">
            <div class="image-wrapper">
                <img src="5.png" alt="05">
            </div>
            <div class="caption">
                <span class="title">Ciri</span>
            </div>
        </div>

        <!-- Proje 6 -->
        <div class="grid-item">
            <div class="image-wrapper">
                <img src="6.png" alt="06">
            </div>
            <div class="caption">
                <span class="title">Rayne</span>
            </div>
        </div>
    </main>

    <!-- LIGHTBOX -->
    <div id="lightbox">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Yakın Görünüm">
    </div>

    <!-- JAVASCRIPT GÜVENLİK VE ETKİLEŞİM KODLARI -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('dragstart', e => e.preventDefault());

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('lightbox-close');
        const gridItems = document.querySelectorAll('.grid-item');

        gridItems.forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault(); 
                const imgSrc = this.querySelector('img').src; 
                lightboxImg.src = imgSrc; 
                lightbox.classList.add('active'); 
            });
        });

        lightbox.addEventListener('click', function(e) {
            if (e.target !== lightboxImg) {
                lightbox.classList.remove('active');
                setTimeout(() => {
                    if(!lightbox.classList.contains('active')) lightboxImg.src = ''; 
                }, 500);
            }
        });
    </script>
</body>
</html>
